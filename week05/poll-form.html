<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form - User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>

    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>

    <main>
        <form>
            <fieldset class="information">
                <legend>Contact Information</legend>

                <label for="fullname">Full name:</label>
                <input type="text" id="fullname" name="fullname" required>


                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

            </fieldset>
            <!--  -->
            <!--  -->
            <fieldset class="questions">
                <legend>Questions</legend>

                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="1">Chrome</option>
                    <option value="2">Safari</option>
                    <option value="3">Edge</option>
                    <option value="4">Brave</option>
                    <option value="5">Other</option>
                </select>


                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">


                <label for="feedback">List the places you have lived:</label>
                <textarea id="feedback" name="feedback" rows="4"
                  placeholder="seoul, daejeon"></textarea>


            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | HTML Form - User Poll Activity | Lee</p>
    </footer>

</body>

</html>
