<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>✅Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <div class="q1">
                    <label for="q1">1.<span>What does the acronym CSS stand for?</span></label>
                    <input type="text" id="q1" name="q1" required>
                </div>

                <div class="q2">
                    <label for="q2">2.<span>How are id and class attributes selected in
                            CSS?</span></label>
                    <textarea id="q2" name="q2" rows="4"></textarea>
                </div>

                <div class="q3">
                    <label for="q3">3.<span>Which of the following is a valid CSS
                            comment?</span></label>
                    <select name="q3" id="q3">
                        <option value="" selected disabled>Chosse one...</option>
                        <option value="1">/* */</option>
                        <option value="2">!-- --</option>
                        <option value="3"># #</option>
                    </select>
                </div>

                <div class="q4">
                    <label for="q4">4.<span>What is the bottom margin given this
                            declaration?</span></label>
                    <p>margin: 10px 5px 15px;</p>
                    <input type="number" name="q4" id="q4">
                </div>

                <button type="submit">Submit Quiz</button>
            </fieldset>


        </form>
    </main>

    <footer>
        <p> &copy; 2026 WDD 130 | Week5 Quiz Form | Lee</p>
    </footer>
</body>

</html>
